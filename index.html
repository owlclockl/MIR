<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIR — меню игры</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    /* Шрифты Basel Grotesk и Martina Plantijn из папки fonts/ */
    @font-face {
      font-family: "Basel Grotesk";
      src: url("fonts/basel-grotesk-regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Basel Grotesk";
      src: url("fonts/basel-grotesk-book.woff2") format("woff2");
      font-weight: 450;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Basel Grotesk";
      src: url("fonts/basel-grotesk-medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Basel Grotesk";
      src: url("fonts/basel-grotesk-bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Martina Plantijn";
      src: url("fonts/martina-plantijn-light.woff2") format("woff2");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Martina Plantijn";
      src: url("fonts/martina-plantijn-light-italic.woff2") format("woff2");
      font-weight: 300;
      font-style: italic;
      font-display: swap;
    }

    /* Единая дизайн-система: цвета, бордеры, скругления, типографика, тени */
    :root {
      color-scheme: dark;
      
      /* Палитра поверхностей */
      --bg: #1f1f1d;
      --surface-1: #262523;
      --surface-2: #1c1b1a;
      --surface-3: #151413;
      --surface-hover: #2e2c29;
      --surface-active: #373531;
      --floating: #232220;
      
      /* Единая система рамок и границ */
      --border-subtle: #2d2b28;
      --border: #3d3935;
      --border-medium: #4e4943;
      --border-strong: #69625a;
      --border-focus: #f4f0eb;
      
      /* Единая типографика и цвета текста */
      --text: #f4f0eb;
      --text-2: #c8c2b9;
      --text-3: #8e887f;
      --muted: #666058;
      
      /* Кнопки и акценты */
      --cta: #fcfaf8;
      --cta-hover: #ece7e0;
      --cta-active: #ded8d0;
      --on-cta: #181716;
      
      /* Статусы */
      --ok: #41be4b;
      --ok-bg: rgba(65, 190, 75, 0.12);
      --ok-border: rgba(65, 190, 75, 0.35);
      
      --danger: #f25550;
      --danger-bg: rgba(242, 85, 80, 0.12);
      --danger-border: rgba(242, 85, 80, 0.35);
      
      /* Единая шкала скруглений */
      --radius-xs: 4px;      /* бейджи, теги, мини-кнопки */
      --radius-sm: 6px;      /* кнопки, поля ввода, вкладки, мини-аватары */
      --radius-md: 8px;      /* внутренние карточки: друзья, комнаты, профиль, правила */
      --radius-lg: 12px;     /* основные борды: центральная панель, окно входа, сайдбар, модальные окна */
      --radius-pill: 9999px; /* переключатели, индикаторы статуса */
      
      /* Тени */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.3);
      --shadow-modal: 0 2px 4px rgba(0, 0, 0, 0.25), 0 20px 48px rgba(0, 0, 0, 0.55);
      
      /* Анимация и шрифты */
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --font: "Basel Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --serif: "Martina Plantijn", Georgia, ui-serif, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: var(--font);
      font-weight: 400;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      background: none;
      padding: 0;
      margin: 0;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .app {
      min-height: 100vh;
      position: relative;
    }

    /* Иконки в едином стиле */
    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      flex: 0 0 auto;
      vertical-align: middle;
      stroke-width: 1.8;
    }

    .icon-sm {
      width: 15px;
      height: 15px;
      stroke-width: 1.8;
    }

    .icon-lg {
      width: 22px;
      height: 22px;
      stroke-width: 1.8;
    }

    /* Кнопка настроек в левом верхнем углу */
    .settings-button {
      position: fixed;
      z-index: 50;
      top: 16px;
      left: 16px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      background: var(--surface-1);
      color: var(--text-2);
      box-shadow: var(--shadow-sm);
      transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
    }

    .settings-button:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      color: var(--text);
    }

    .settings-button:active {
      transform: scale(0.96);
    }

    /* Центрированная страница входа */
    .page-center {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    /* Борды и карточки в едином стиле */
    .auth-card,
    .center-card,
    .modal-card,
    .lobby-sidebar {
      border: 1px solid var(--border);
      background: var(--surface-1);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }

    .auth-card {
      width: min(420px, 100%);
      padding: 32px 28px 28px;
      position: relative;
    }

    /* SVG Логотип и брендинг */
    .brand {
      display: grid;
      justify-items: center;
      gap: 12px;
      margin-bottom: 24px;
      text-align: center;
    }

    .brand-logo-svg-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-emblem-svg {
      width: 48px;
      height: 48px;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
    }

    .brand-title-svg-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-wordmark-svg {
      width: 140px;
      height: 38px;
      display: block;
    }

    .brand-subtitle,
    .main-subtitle {
      margin: 0;
      color: var(--text-2);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Зелёный хайлайт в едином стиле */
    .hl {
      display: inline-block;
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      background: var(--ok);
      color: #161514;
      font-weight: 600;
      font-size: 0.9em;
      font-style: normal;
      vertical-align: baseline;
      letter-spacing: 0.02em;
    }

    .muted,
    .empty-text {
      color: var(--text-3);
    }

    /* Вкладки входа / регистрации */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-3);
      margin-bottom: 20px;
    }

    .tab-button {
      height: 34px;
      border-radius: var(--radius-xs);
      background: transparent;
      color: var(--text-3);
      font-weight: 500;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: color .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease);
    }

    .tab-button:hover {
      color: var(--text);
    }

    .tab-button.active {
      color: var(--text);
      background: var(--surface-1);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    /* Формы и инпуты в едином стиле */
    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-3);
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      transition: border-color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
    }

    .input::placeholder {
      color: var(--muted);
    }

    .input:focus {
      border-color: var(--border-strong);
      background: var(--surface-3);
      outline: none;
      box-shadow: 0 0 0 1px var(--border-strong);
    }

    /* Кнопки в едином стиле */
    .primary-button,
    .ghost-button,
    .tiny-button,
    .main-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 500;
      transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease), opacity .18s var(--ease);
      user-select: none;
      text-decoration: none;
    }

    .primary-button {
      min-height: 44px;
      padding: 0 18px;
      border-radius: var(--radius-sm);
      background: var(--cta);
      color: var(--on-cta);
      border: 1px solid var(--cta);
      font-size: 14px;
      box-shadow: var(--shadow-sm);
    }

    .primary-button:hover {
      background: var(--cta-hover);
      border-color: var(--cta-hover);
    }

    .primary-button:active {
      background: var(--cta-active);
      transform: scale(0.985);
    }

    .ghost-button {
      min-height: 40px;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-medium);
      background: transparent;
      color: var(--text-2);
      font-size: 14px;
    }

    .ghost-button:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      color: var(--text);
    }

    .ghost-button:active {
      transform: scale(0.985);
    }

    .tiny-button {
      min-height: 30px;
      padding: 0 10px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-medium);
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      white-space: nowrap;
    }

    .tiny-button:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      color: var(--text);
    }

    .tiny-button:active {
      transform: scale(0.98);
    }

    .tiny-button.danger {
      border-color: var(--danger-border);
      color: var(--danger);
    }

    .tiny-button.danger:hover {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .hint {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    /* Раскладка главного экрана игры */
    .game-layout {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 382px 32px 32px;
    }

    .center-card {
      width: min(520px, calc(100vw - 64px));
      min-height: 480px;
      padding: 44px 36px;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      gap: 0;
    }

    /* Центральный бренд-блок в SVG */
    .hero-brand {
      display: grid;
      justify-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .hero-emblem-svg {
      width: 56px;
      height: 56px;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35));
    }

    .hero-wordmark-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-wordmark-svg {
      width: clamp(160px, 30vw, 210px);
      height: auto;
      display: block;
    }

    .main-subtitle {
      margin: 14px 0 32px;
      max-width: 420px;
      font-size: 15px;
      line-height: 1.5;
    }

    .main-actions {
      width: min(320px, 100%);
      display: grid;
      gap: 12px;
    }

    .main-button {
      min-height: 50px;
      padding: 0 20px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      background: var(--cta);
      color: var(--on-cta);
      border: 1px solid var(--cta);
      box-shadow: var(--shadow-sm);
    }

    .main-button:hover {
      background: var(--cta-hover);
      border-color: var(--cta-hover);
    }

    .main-button:active {
      background: var(--cta-active);
      transform: scale(0.985);
    }

    .main-button.secondary {
      border: 1px solid var(--border-medium);
      background: transparent;
      color: var(--text);
    }

    .main-button.secondary:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    .session-note {
      margin-top: 24px;
      color: var(--muted);
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .session-note strong {
      color: var(--text-2);
      font-weight: 500;
    }

    /* Сайдбар лобби */
    .lobby-sidebar {
      position: fixed;
      z-index: 20;
      top: 16px;
      right: 16px;
      width: 342px;
      max-width: calc(100vw - 32px);
      height: calc(100vh - 32px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .sidebar-head,
    .section-head,
    .row,
    .profile-row,
    .room-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-head {
      justify-content: space-between;
      padding-bottom: 2px;
    }

    .sidebar-brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-title {
      display: grid;
      gap: 2px;
    }

    .sidebar-title strong,
    .section-head strong {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .sidebar-title span,
    .section-head span,
    .small {
      color: var(--muted);
      font-size: 12px;
    }

    /* Внутренние карточки разделов */
    .profile-card,
    .section {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }

    .profile-card {
      padding: 12px;
    }

    .profile-row {
      justify-content: space-between;
    }

    .profile-main {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Аватар в едином стиле */
    .avatar {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--border-medium);
      background: var(--surface-3);
      color: var(--text);
      font-weight: 500;
      font-size: 13.5px;
      text-transform: uppercase;
      overflow: visible;
    }

    .avatar.small-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-xs);
      font-size: 12px;
    }

    .status-dot {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 10px;
      height: 10px;
      border: 2px solid var(--surface-2);
      border-radius: var(--radius-pill);
      background: var(--muted);
    }

    .status-dot.online {
      background: var(--ok);
      box-shadow: 0 0 6px rgba(65, 190, 75, 0.45);
    }

    .name-stack {
      min-width: 0;
      display: grid;
      gap: 2px;
      text-align: left;
    }

    .name-stack strong,
    .name-stack span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .name-stack strong {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
    }

    .name-stack span {
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .section-head {
      justify-content: space-between;
    }

    .sidebar-scroll {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      gap: 12px;
      padding-right: 4px;
    }

    .sidebar-scroll::-webkit-scrollbar,
    .modal-body::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-scroll::-webkit-scrollbar-thumb,
    .modal-body::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: var(--radius-pill);
    }

    .sidebar-scroll::-webkit-scrollbar-track,
    .modal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .friend-card,
    .invite-card,
    .request-card,
    .room-card {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--surface-3);
      border: 1px solid var(--border-subtle);
      transition: border-color .18s var(--ease), background .18s var(--ease);
    }

    .friend-card:hover,
    .invite-card:hover,
    .request-card:hover,
    .room-card:hover {
      border-color: var(--border-medium);
    }

    .friend-card,
    .invite-card,
    .request-card {
      display: grid;
      gap: 10px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .friend-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .friend-form .input {
      min-height: 34px;
      font-size: 13px;
      padding: 0 10px;
    }

    .empty-text {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
    }

    .room-card {
      display: grid;
      gap: 10px;
    }

    .room-line {
      justify-content: space-between;
      min-width: 0;
    }

    .room-badge {
      padding: 2px 7px;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xs);
      background: var(--surface-3);
      color: var(--text-3);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    /* Модальные окна в едином стиле */
    .modal-layer {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }

    .modal-card {
      width: min(540px, 100%);
      max-height: min(720px, calc(100vh - 48px));
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-modal);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .modal-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .modal-body {
      overflow-y: auto;
      padding: 20px;
      display: grid;
      gap: 14px;
    }

    .rule-box {
      padding: 12px 14px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 13px;
      line-height: 1.55;
    }

    .rule-box strong {
      color: var(--text);
      font-weight: 500;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 0;
    }

    /* Переключатель (Toggle Switch) */
    .switch {
      width: 44px;
      height: 26px;
      flex: 0 0 auto;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-medium);
      background: var(--surface-3);
      padding: 3px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: background .18s var(--ease), border-color .18s var(--ease);
    }

    .switch::before {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text-3);
      transition: transform .18s var(--ease), background .18s var(--ease);
    }

    .switch.active {
      background: var(--cta);
      border-color: var(--cta);
    }

    .switch.active::before {
      background: var(--on-cta);
      transform: translateX(18px);
    }

    /* Всплывающие уведомления (Toast) */
    .toast {
      position: fixed;
      z-index: 120;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      min-width: min(420px, calc(100vw - 32px));
      padding: 12px 18px;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      background: var(--surface-1);
      box-shadow: var(--shadow-modal);
      color: var(--text);
      font-size: 13.5px;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: toastIn .22s var(--ease);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, 10px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .hidden {
      display: none !important;
    }

    /* Адаптивность для мобильных устройств */
    @media (max-width: 920px) {
      .game-layout {
        min-height: auto;
        padding: 84px 16px 24px;
        place-items: start center;
      }

      .center-card {
        min-height: 420px;
        padding: 36px 20px;
      }

      .lobby-sidebar {
        position: relative;
        inset: auto;
        width: min(520px, calc(100vw - 32px));
        height: auto;
        max-height: none;
        margin: 0 auto 24px;
      }

      .app.game-active {
        display: flex;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Главный контейнер приложения -->
  <main id="app" class="app" aria-live="polite"></main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script>
    'use strict';

    const STORAGE_KEY = 'mir.game.state.v1';
    const SESSION_KEY = 'mir.game.session.v1';
    const SETTINGS_KEY = 'mir.game.settings.v1';
    const ACTIVE_LIMIT_MS = 5 * 60 * 1000;

    const ui = {
      authMode: 'login',
      modal: null,
      toastTimer: null
    };

    const app = document.getElementById('app');
    const modalRoot = document.getElementById('modal-root');
    const toastRoot = document.getElementById('toast-root');

    /* Единая библиотека SVG-иконок */
    const iconPaths = {
      gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
      crown: '<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 11.336A2 2 0 0 1 17.206 19H6.794a2 2 0 0 1-1.941-1.645L2.019 6.019a.5.5 0 0 1 .798-.519l4.277 3.664a1 1 0 0 0 1.516-.294l2.952-5.604Z"/>',
      play: '<polygon points="6 3 20 12 6 21 6 3"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>',
      mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
      door: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>',
      logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
      check: '<polyline points="20 6 9 17 4 12"/>',
      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
      shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
      sparkles: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/>',
      info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'
    };

    function icon(name, className = 'icon') {
      return '<svg class="' + className + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (iconPaths[name] || '') + '</svg>';
    }

    /* Генерация SVG логотипов MIR */
    function renderLogoAuth() {
      return `
        <div class="brand" aria-label="MIR">
          <div class="brand-logo-svg-wrap">
            <svg class="brand-emblem-svg" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="1" y="1" width="50" height="50" rx="12" fill="var(--surface-3)" stroke="var(--border-medium)" stroke-width="1.4"/>
              <path d="M15 36V18L26 28L37 18V36" stroke="var(--text)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="26" cy="14" r="2.2" fill="var(--ok)"/>
            </svg>
          </div>
          <div class="brand-title-svg-wrap">
            <svg class="brand-wordmark-svg" viewBox="0 0 130 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="MIR">
              <g stroke="var(--text)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" fill="none">
                <path d="M5 32V6L20 20L35 6V32"/>
                <path d="M48 6H60 M54 6V32 M48 32H60"/>
                <path d="M74 32V6H88C95 6 99.5 10 99.5 15.5C99.5 21 95 25 88 25H74 M85 25L100 32"/>

    }

    function renderLogoHero() {
      return `
        <div class="hero-brand" aria-label="MIR">
          <div class="hero-brand-top">
            <svg class="hero-emblem-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="var(--surface-3)" stroke="var(--border-medium)" stroke-width="1.6"/>
              <path d="M18 44V22L32 34.5L46 22V44" stroke="var(--text)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="32" cy="17" r="2.6" fill="var(--ok)"/>
            </svg>
          </div>
          <div class="hero-wordmark-wrap">
            <svg class="hero-wordmark-svg" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="MIR">
              <g stroke="var(--text)" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" fill="none">
                <path d="M10 40V8L32 27L54 8V40"/>
                <path d="M74 8H92 M83 8V40 M74 40H92" stroke-width="2.8"/>
                <path d="M110 40V8H131C140.5 8 147.5 13.5 147.5 22C147.5 30.5 140.5 34 131 34H110 M127 34L148 40" stroke-width="2.8"/>
              </g>
              <circle cx="170" cy="24" r="4.5" fill="var(--ok)"/>
            </svg>
          </div>
        </div>
      `;
    }

    function renderLogoMark(size = 20) {
      return `
        <svg class="mini-logo-mark" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex:0 0 auto;">
          <rect x="1" y="1" width="22" height="22" rx="5" fill="var(--surface-3)" stroke="var(--border-medium)" stroke-width="1.2"/>
          <path d="M6 18V8L12 13.5L18 8V18" stroke="var(--text)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="6" r="1.1" fill="var(--ok)"/>
        </svg>
      `;
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      })[char]);
    }

    function now() {
      return Date.now();
    }

    function uid(prefix) {
      if (window.crypto && crypto.randomUUID) {
        return prefix + '-' + crypto.randomUUID();
      }
      return prefix + '-' + Math.random().toString(36).slice(2) + '-' + now().toString(36);
    }

    function getDefaultStore() {
      return {
        version: 1,
        users: {},
        friendships: [],
        friendRequests: [],
        rooms: {}
      };
    }

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultStore();
        const parsed = JSON.parse(raw);
        return {
          ...getDefaultStore(),
          ...parsed,
          users: parsed.users || {},
          friendships: Array.isArray(parsed.friendships) ? parsed.friendships : [],
          friendRequests: Array.isArray(parsed.friendRequests) ? parsed.friendRequests : [],
          rooms: parsed.rooms || {}
        };
      } catch (error) {
        console.warn('Store reset after parse error:', error);
        return getDefaultStore();
      }
    }

    function saveStore(store) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    function loadSettings() {
      try {
        return { reduceMotion: false, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') };
      } catch {
        return { reduceMotion: false };
      }
    }

    function saveSettings(settings) {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      document.documentElement.style.scrollBehavior = settings.reduceMotion ? 'auto' : '';
    }

    function getSessionUserId() {
      return localStorage.getItem(SESSION_KEY);
    }

    function setSessionUserId(userId) {
      localStorage.setItem(SESSION_KEY, userId);
    }

    function clearSession() {
      localStorage.removeItem(SESSION_KEY);
    }

    function normalizeLogin(login) {
      return String(login || '').trim().toLowerCase().replace(/\s+/g, '');
    }

    function getInitials(name) {
      const cleaned = String(name || 'M').trim();
      const parts = cleaned.split(/\s+/).filter(Boolean);
      if (parts.length > 1) return (parts[0][0] + parts[1][0]).slice(0, 2).toUpperCase();
      return cleaned.slice(0, 2).toUpperCase();
    }

    function getAvatarHue(seed) {
      let hash = 0;
      for (let i = 0; i < seed.length; i += 1) hash = ((hash << 5) - hash) + seed.charCodeAt(i);
      return Math.abs(hash) % 360;
    }

    function fallbackHash(text) {
      let h1 = 0xdeadbeef;
      let h2 = 0x41c6ce57;
      for (let i = 0; i < text.length; i += 1) {
        const ch = text.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return ((h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0'));
    }

    async function hashPassword(password, salt) {
      const text = salt + ':' + password;
      if (window.crypto && crypto.subtle && window.TextEncoder) {
        const bytes = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
      }
      return fallbackHash(text);
    }

    function currentUser(store = loadStore()) {
      return store.users[getSessionUserId()] || null;
    }

    function isOnline(user) {
      return Boolean(user && (now() - Number(user.lastActive || 0) < ACTIVE_LIMIT_MS));
    }

    function getFriends(store, userId) {
      return store.friendships
        .filter(link => link.userA === userId || link.userB === userId)
        .map(link => store.users[link.userA === userId ? link.userB : link.userA])
        .filter(Boolean)
        .sort((a, b) => Number(isOnline(b)) - Number(isOnline(a)) || a.displayName.localeCompare(b.displayName, 'ru'));
    }

    function areFriends(store, a, b) {
      return store.friendships.some(link => (link.userA === a && link.userB === b) || (link.userA === b && link.userB === a));
    }

    function getIncomingFriendRequests(store, userId) {
      return store.friendRequests.filter(request => request.toId === userId && request.status === 'pending');
    }

    function getOutgoingFriendRequests(store, userId) {
      return store.friendRequests.filter(request => request.fromId === userId && request.status === 'pending');
    }

    function getOpenRooms(store) {
      return Object.values(store.rooms).filter(room => room.status === 'open');
    }

    function getCurrentRoom(store, userId) {
      return getOpenRooms(store)
        .filter(room => room.members.includes(userId))
        .sort((a, b) => b.updatedAt - a.updatedAt)[0] || null;
    }

    function getIncomingRoomInvites(store, userId) {
      return getOpenRooms(store)
        .flatMap(room => (room.invites || [])
          .filter(invite => invite.toId === userId && invite.status === 'pending')
          .map(invite => ({ ...invite, room })));
    }

    function markActive() {
      const store = loadStore();
      const user = currentUser(store);
      if (!user) return;
      user.lastActive = now();
      saveStore(store);
    }

    function showToast(message) {
      toastRoot.innerHTML = '<div class="toast" role="status">' + icon('info', 'icon-sm') + ' <span>' + escapeHTML(message) + '</span></div>';
      clearTimeout(ui.toastTimer);
      ui.toastTimer = setTimeout(() => {
        toastRoot.innerHTML = '';
      }, 2800);
    }

    function setModal(name) {
      ui.modal = name;
      render();
    }

    function closeModal() {
      ui.modal = null;
      render();
    }

    async function registerAccount(form) {
      const login = normalizeLogin(form.login.value);
      const displayName = String(form.displayName.value || '').trim();
      const password = String(form.password.value || '');
      if (login.length < 3) return showToast('Логин должен быть от 3 символов.');
      if (!/^[a-zа-яё0-9_.-]+$/i.test(login)) return showToast('В логине можно использовать буквы, цифры, точку, подчёркивание и дефис.');
      if (password.length < 6) return showToast('Пароль должен быть от 6 символов.');

      const store = loadStore();
      const loginExists = Object.values(store.users).some(user => user.login === login);
      if (loginExists) return showToast('Такой логин уже занят.');

      const salt = uid('salt');
      const user = {
        id: uid('user'),
        login,
        displayName: displayName || login,
        passwordHash: await hashPassword(password, salt),
        salt,
        avatarHue: getAvatarHue(login),
        createdAt: now(),
        lastActive: now()
      };
      store.users[user.id] = user;
      saveStore(store);
      setSessionUserId(user.id);
      showToast('Аккаунт создан.');
      render();
    }

    async function loginAccount(form) {
      const login = normalizeLogin(form.login.value);
      const password = String(form.password.value || '');
      const store = loadStore();
      const user = Object.values(store.users).find(item => item.login === login);
      if (!user) return showToast('Аккаунт не найден.');
      const hash = await hashPassword(password, user.salt);
      if (hash !== user.passwordHash) return showToast('Неверный пароль.');
      user.lastActive = now();
      saveStore(store);
      setSessionUserId(user.id);
      showToast('Вход выполнен.');
      render();
    }

    function logoutAccount() {
      clearSession();
      ui.modal = null;
      showToast('Вы вышли из аккаунта.');
      render();
    }

    function addFriend(login) {
      const friendLogin = normalizeLogin(login);
      const store = loadStore();
      const me = currentUser(store);
      if (!me) return;
      const target = Object.values(store.users).find(user => user.login === friendLogin);
      if (!target) return showToast('Пользователь не найден.');
      if (target.id === me.id) return showToast('Нельзя добавить себя.');
      if (areFriends(store, me.id, target.id)) return showToast('Этот игрок уже в друзьях.');
      const pending = store.friendRequests.some(request => request.status === 'pending' && (
        (request.fromId === me.id && request.toId === target.id) ||
        (request.fromId === target.id && request.toId === me.id)
      ));
      if (pending) return showToast('Заявка уже ожидает ответа.');
      store.friendRequests.push({
        id: uid('friend-request'),
        fromId: me.id,
        toId: target.id,
        status: 'pending',
        createdAt: now()
      });
      saveStore(store);
      showToast('Заявка отправлена.');
      render();
    }

    function acceptFriendRequest(requestId) {
      const store = loadStore();
      const me = currentUser(store);
      const request = store.friendRequests.find(item => item.id === requestId && item.toId === me?.id && item.status === 'pending');
      if (!request) return showToast('Заявка не найдена.');
      request.status = 'accepted';
      if (!areFriends(store, request.fromId, request.toId)) {
        store.friendships.push({ id: uid('friendship'), userA: request.fromId, userB: request.toId, createdAt: now() });
      }
      saveStore(store);
      showToast('Друг добавлен.');
      render();
    }

    function declineFriendRequest(requestId) {
      const store = loadStore();
      const me = currentUser(store);
      const request = store.friendRequests.find(item => item.id === requestId && item.toId === me?.id && item.status === 'pending');
      if (!request) return;
      request.status = 'declined';
      saveStore(store);
      showToast('Заявка отклонена.');
      render();
    }

    function leaveCurrentRooms(store, userId) {
      getOpenRooms(store).forEach(room => {
        if (!room.members.includes(userId)) return;
        if (room.ownerId === userId) {
          room.status = 'closed';
          room.updatedAt = now();
          return;
        }
        room.members = room.members.filter(memberId => memberId !== userId);
        room.updatedAt = now();
      });
    }

    function createMasterRoom() {
      const store = loadStore();
      const me = currentUser(store);
      if (!me) return;
      leaveCurrentRooms(store, me.id);
      const room = {
        id: uid('room'),
        name: 'Комната ' + me.displayName,
        ownerId: me.id,
        role: 'master',
        status: 'open',
        members: [me.id],
        invites: [],
        createdAt: now(),
        updatedAt: now()
      };
      store.rooms[room.id] = room;
      saveStore(store);
      showToast('Комната мастера создана. Пригласите друзей справа.');
      render();
    }

    function closeCurrentRoom() {
      const store = loadStore();
      const me = currentUser(store);
      const room = getCurrentRoom(store, me?.id);
      if (!room) return;
      if (room.ownerId === me.id) {
        room.status = 'closed';
      } else {
        room.members = room.members.filter(memberId => memberId !== me.id);
      }
      room.updatedAt = now();
      saveStore(store);
      showToast(room.ownerId === me.id ? 'Комната закрыта.' : 'Вы вышли из комнаты.');
      render();
    }

    function inviteFriend(friendId) {
      const store = loadStore();
      const me = currentUser(store);
      const room = getCurrentRoom(store, me?.id);
      if (!me || !room) return showToast('Сначала создайте комнату мастера.');
      if (!areFriends(store, me.id, friendId)) return showToast('Можно приглашать только друзей.');
      if (room.members.includes(friendId)) return showToast('Игрок уже в комнате.');
      const existing = (room.invites || []).some(invite => invite.toId === friendId && invite.status === 'pending');
      if (existing) return showToast('Приглашение уже отправлено.');
      room.invites = room.invites || [];
      room.invites.push({
        id: uid('room-invite'),
        roomId: room.id,
        fromId: me.id,
        toId: friendId,
        status: 'pending',
        createdAt: now()
      });
      room.updatedAt = now();
      saveStore(store);
      showToast('Приглашение отправлено.');
      render();
    }

    function acceptRoomInvite(inviteId) {
      const store = loadStore();
      const me = currentUser(store);
      const target = getIncomingRoomInvites(store, me?.id).find(invite => invite.id === inviteId);
      if (!target) return showToast('Приглашение не найдено.');
      leaveCurrentRooms(store, me.id);
      const room = store.rooms[target.room.id];
      const invite = room.invites.find(item => item.id === inviteId);
      invite.status = 'accepted';
      if (!room.members.includes(me.id)) room.members.push(me.id);
      room.updatedAt = now();
      saveStore(store);
      ui.modal = null;
      showToast('Вы вошли в комнату.');
      render();
    }

    function declineRoomInvite(inviteId) {
      const store = loadStore();
      const me = currentUser(store);
      const target = getIncomingRoomInvites(store, me?.id).find(invite => invite.id === inviteId);
      if (!target) return;
      const room = store.rooms[target.room.id];
      const invite = room.invites.find(item => item.id === inviteId);
      invite.status = 'declined';
      room.updatedAt = now();
      saveStore(store);
      showToast('Приглашение отклонено.');
      render();
    }

    function renderAuth() {
      app.className = 'app';
      app.innerHTML = `
        <button class="settings-button" type="button" data-action="open-settings" aria-label="Настройки" title="Настройки">${icon('gear')}</button>
        <section class="page-center">
          <div class="auth-card">
            ${renderLogoAuth()}
            <div class="auth-tabs" role="tablist" aria-label="Аккаунт">
              <button class="tab-button ${ui.authMode === 'login' ? 'active' : ''}" type="button" data-action="auth-mode" data-mode="login">${icon('door', 'icon-sm')} Вход</button>
              <button class="tab-button ${ui.authMode === 'register' ? 'active' : ''}" type="button" data-action="auth-mode" data-mode="register">${icon('userPlus', 'icon-sm')} Создать</button>
            </div>
            ${ui.authMode === 'login' ? renderLoginForm() : renderRegisterForm()}
            <p class="hint">Аккаунты, друзья, комнаты и приглашения сохраняются локально в браузере.</p>
          </div>
        </section>
      `;
      renderModal();
    }

    function renderLoginForm() {
      return `
        <form class="form" data-form="login">
          <div class="field">
            <label for="login-name">Логин</label>
            <input class="input" id="login-name" name="login" autocomplete="username" placeholder="например, master" required>
          </div>
          <div class="field">
            <label for="login-password">Пароль</label>
            <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="минимум 6 символов" required>
          </div>
          <button class="primary-button" type="submit">${icon('door')} Войти</button>
        </form>
      `;
    }

    function renderRegisterForm() {
      return `
        <form class="form" data-form="register">
          <div class="field">
            <label for="register-login">Логин</label>
            <input class="input" id="register-login" name="login" autocomplete="username" placeholder="уникальный логин" required>
          </div>
          <div class="field">
            <label for="register-name">Имя</label>
            <input class="input" id="register-name" name="displayName" autocomplete="nickname" placeholder="как показывать в лобби">
          </div>
          <div class="field">
            <label for="register-password">Пароль</label>
            <input class="input" id="register-password" name="password" type="password" autocomplete="new-password" placeholder="минимум 6 символов" required>
          </div>
          <button class="primary-button" type="submit">${icon('userPlus')} Создать аккаунт</button>
        </form>
      `;
    }

    function renderGame() {
      const store = loadStore();
      const me = currentUser(store);
      const room = getCurrentRoom(store, me.id);
      const friends = getFriends(store, me.id);
      const incomingInvites = getIncomingRoomInvites(store, me.id);
      app.className = 'app game-active';
      app.innerHTML = `
        <button class="settings-button" type="button" data-action="open-settings" aria-label="Настройки" title="Настройки">${icon('gear')}</button>
        <section class="game-layout" aria-label="Главное меню">
          <div class="center-card">
            ${renderLogoHero()}
            <p class="main-subtitle">Главные действия находятся в центре. Интерфейс тёмный, <span class="hl">спокойный</span> и без лишнего шума.</p>
            <div class="main-actions">
              <button class="main-button" type="button" data-action="create-master-room">${icon('crown')} Мастер</button>
              <button class="main-button secondary" type="button" data-action="open-player">${icon('play')} Игрок</button>
            </div>
            <div class="session-note">${icon('user', 'icon-sm')} Аккаунт: <strong>${escapeHTML(me.displayName)}</strong> · ${room ? 'в комнате' : 'без активной комнаты'}</div>
          </div>
        </section>
        ${renderLobby(store, me, friends, room, incomingInvites)}
      `;
      renderModal();
    }

    function renderLobby(store, me, friends, room, incomingInvites) {
      const incomingFriendRequests = getIncomingFriendRequests(store, me.id);
      const outgoingFriendRequests = getOutgoingFriendRequests(store, me.id);
      return `
        <aside class="lobby-sidebar" aria-label="Лобби друзей">
          <div class="sidebar-head">
            <div class="sidebar-title">
              <div class="sidebar-brand-row">
                ${renderLogoMark(18)}
                <strong>Лобби</strong>
              </div>
              <span>друзья и приглашения</span>
            </div>
            <button class="tiny-button danger" type="button" data-action="logout" title="Выйти">${icon('logout')} Выйти</button>
          </div>

          <div class="profile-card">
            <div class="profile-row">
              <div class="profile-main">
                ${renderAvatar(me, true)}
                <div class="name-stack">
                  <strong>${escapeHTML(me.displayName)}</strong>
                  <span>@${escapeHTML(me.login)}</span>
                </div>
              </div>
              <span class="room-badge">online</span>
            </div>
          </div>

          <div class="sidebar-scroll">
            <section class="section" aria-label="Текущая комната">
              <div class="section-head">
                <strong>Комната</strong>
                ${room ? '<span>' + room.members.length + ' участник(а)</span>' : '<span>нет</span>'}
              </div>
              ${room ? renderRoomCard(store, room, me.id) : '<p class="empty-text">Нажмите «Мастер», чтобы создать комнату и пригласить друзей.</p>'}
            </section>

            <section class="section" aria-label="Добавить друга">
              <div class="section-head">
                <strong>Добавить друга</strong>
                <span>по логину</span>
              </div>
              <form class="friend-form" data-form="add-friend">
                <input class="input" name="login" placeholder="логин игрока" aria-label="Логин игрока" required>
                <button class="tiny-button" type="submit">${icon('plus')} Добавить</button>
              </form>
            </section>

            ${incomingFriendRequests.length ? renderFriendRequests(store, incomingFriendRequests) : ''}
            ${incomingInvites.length ? renderRoomInvites(store, incomingInvites) : ''}

            <section class="section" aria-label="Друзья">
              <div class="section-head">
                <strong>Друзья</strong>
                <span>${friends.length}</span>
              </div>
              ${friends.length ? friends.map(friend => renderFriendCard(friend, room)).join('') : '<p class="empty-text">Список пуст. Создайте второй аккаунт, отправьте заявку по логину и примите её.</p>'}
              ${outgoingFriendRequests.length ? '<p class="empty-text">Ожидают ответа: ' + outgoingFriendRequests.map(req => '@' + escapeHTML(store.users[req.toId]?.login || 'unknown')).join(', ') + '</p>' : ''}
            </section>
          </div>
        </aside>
      `;
    }

    function renderAvatar(user, online) {
      return `
        <div class="avatar${online ? '' : ' small-avatar'}" style="--hue:${Number(user.avatarHue || 0)}">
          ${escapeHTML(getInitials(user.displayName || user.login))}
          <span class="status-dot ${isOnline(user) ? 'online' : ''}" aria-label="${isOnline(user) ? 'online' : 'offline'}"></span>
        </div>
      `;
    }

    function renderRoomCard(store, room, currentUserId) {
      const owner = store.users[room.ownerId];
      const members = room.members.map(id => store.users[id]).filter(Boolean);
      const isOwner = room.ownerId === currentUserId;
      return `
        <div class="room-card">
          <div class="room-line">
            <div class="name-stack">
              <strong>${escapeHTML(room.name)}</strong>
              <span>мастер: ${escapeHTML(owner?.displayName || 'unknown')}</span>
            </div>
            <span class="room-badge">${isOwner ? 'master' : 'player'}</span>
          </div>
          <div class="row" aria-label="Участники">
            ${members.map(member => renderAvatar(member, false)).join('')}
          </div>
          <button class="tiny-button danger" type="button" data-action="close-room">${icon('x')} ${isOwner ? 'Закрыть' : 'Выйти'}</button>
        </div>
      `;
    }

    function renderFriendCard(friend, room) {
      const canInvite = Boolean(room && !room.members.includes(friend.id));
      return `
        <article class="friend-card">
          <div class="profile-row">
            <div class="profile-main">
              ${renderAvatar(friend, false)}
              <div class="name-stack">
                <strong>${escapeHTML(friend.displayName)}</strong>
                <span>${isOnline(friend) ? 'online' : 'offline'} · @${escapeHTML(friend.login)}</span>
              </div>
            </div>
          </div>
          <div class="card-actions">
            <button class="tiny-button" type="button" data-action="invite-friend" data-friend-id="${escapeHTML(friend.id)}" ${canInvite ? '' : 'disabled'}>${icon('mail')} Пригласить</button>
          </div>
        </article>
      `;
    }

    function renderFriendRequests(store, requests) {
      return `
        <section class="section" aria-label="Заявки в друзья">
          <div class="section-head">
            <strong>Заявки</strong>
            <span>${requests.length}</span>
          </div>
          ${requests.map(request => {
            const from = store.users[request.fromId];
            return `
              <article class="request-card">
                <div class="profile-row">
                  <div class="profile-main">
                    ${from ? renderAvatar(from, false) : ''}
                    <div class="name-stack">
                      <strong>${escapeHTML(from?.displayName || 'Игрок')}</strong>
                      <span>хочет добавить вас</span>
                    </div>
                  </div>
                </div>
                <div class="card-actions">
                  <button class="tiny-button" type="button" data-action="accept-friend" data-request-id="${escapeHTML(request.id)}">${icon('check')} Принять</button>
                  <button class="tiny-button danger" type="button" data-action="decline-friend" data-request-id="${escapeHTML(request.id)}">${icon('x')} Отклонить</button>
                </div>
              </article>
            `;
          }).join('')}
        </section>
      `;
    }

    function renderRoomInvites(store, invites) {
      return `
        <section class="section" aria-label="Приглашения в комнаты">
          <div class="section-head">
            <strong>Приглашения</strong>
            <span>${invites.length}</span>
          </div>
          ${invites.map(invite => {
            const from = store.users[invite.fromId];
            return `
              <article class="invite-card">
                <div class="profile-row">
                  <div class="profile-main">
                    ${from ? renderAvatar(from, false) : ''}
                    <div class="name-stack">
                      <strong>${escapeHTML(invite.room.name)}</strong>
                      <span>от ${escapeHTML(from?.displayName || 'игрока')}</span>
                    </div>
                  </div>
                </div>
                <div class="card-actions">
                  <button class="tiny-button" type="button" data-action="accept-room" data-invite-id="${escapeHTML(invite.id)}">${icon('check')} Войти</button>
                  <button class="tiny-button danger" type="button" data-action="decline-room" data-invite-id="${escapeHTML(invite.id)}">${icon('x')} Нет</button>
                </div>
              </article>
            `;
          }).join('')}
        </section>
      `;
    }

    function renderModal() {
      if (!ui.modal) {
        modalRoot.innerHTML = '';
        return;
      }
      if (ui.modal === 'settings') return renderSettingsModal();
      if (ui.modal === 'player') return renderPlayerModal();
    }

    function modalFrame(title, body, headerIcon = null) {
      modalRoot.innerHTML = `
        <div class="modal-layer" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}" data-action="modal-backdrop">
          <section class="modal-card">
            <header class="modal-head">
              <div class="modal-title-row">
                ${headerIcon || ''}
                <h2>${escapeHTML(title)}</h2>
              </div>
              <button class="tiny-button" type="button" data-action="close-modal" aria-label="Закрыть" title="Закрыть">${icon('x')}</button>
            </header>
            <div class="modal-body">${body}</div>
          </section>
        </div>
      `;
    }

    function renderSettingsModal() {
      const settings = loadSettings();
      modalFrame('Настройки', `
        <div class="rule-box">
          <strong>Правило проекта:</strong> не добавлять лишние функции, экраны, эффекты или декор без прямого запроса. Сохранять минимализм, тёмные серые/белые тона и понятную структуру.
        </div>
        <div class="switch-row">
          <div class="name-stack">
            <strong>Снизить анимации</strong>
            <span>оставляет интерфейс спокойным и удобным</span>
          </div>
          <button class="switch ${settings.reduceMotion ? 'active' : ''}" type="button" data-action="toggle-motion" aria-label="Снизить анимации"></button>
        </div>
      `, renderLogoMark(20));
    }

    function renderPlayerModal() {
      const store = loadStore();
      const me = currentUser(store);
      if (!me) return closeModal();
      const invites = getIncomingRoomInvites(store, me.id);
      const ownRoom = getCurrentRoom(store, me.id);
      modalFrame('Игрок', `
        <div class="rule-box">
          Режим игрока показывает только реальные приглашения в комнаты. Публичных демо-комнат здесь нет.
        </div>
        ${ownRoom ? renderRoomCard(store, ownRoom, me.id) : ''}
        ${invites.length ? renderRoomInvites(store, invites) : '<p class="empty-text">Приглашений пока нет. Когда друг создаст комнату и пригласит вас, она появится здесь и справа в лобби.</p>'}
      `, icon('play', 'icon-sm'));
    }

    function render() {
      const store = loadStore();
      const me = currentUser(store);
      if (!me) {
        renderAuth();
      } else {
        renderGame();
      }
    }

    document.addEventListener('click', event => {
      const actionElement = event.target.closest('[data-action]');
      if (!actionElement) return;
      const action = actionElement.dataset.action;

      if (action === 'modal-backdrop' && event.target === actionElement) closeModal();
      if (action === 'open-settings') setModal('settings');
      if (action === 'close-modal') closeModal();
      if (action === 'auth-mode') {
        ui.authMode = actionElement.dataset.mode || 'login';
        render();
      }
      if (action === 'logout') logoutAccount();
      if (action === 'create-master-room') createMasterRoom();
      if (action === 'open-player') setModal('player');
      if (action === 'close-room') closeCurrentRoom();
      if (action === 'invite-friend') inviteFriend(actionElement.dataset.friendId);
      if (action === 'accept-friend') acceptFriendRequest(actionElement.dataset.requestId);
      if (action === 'decline-friend') declineFriendRequest(actionElement.dataset.requestId);
      if (action === 'accept-room') acceptRoomInvite(actionElement.dataset.inviteId);
      if (action === 'decline-room') declineRoomInvite(actionElement.dataset.inviteId);
      if (action === 'toggle-motion') {
        const settings = loadSettings();
        settings.reduceMotion = !settings.reduceMotion;
        saveSettings(settings);
        render();
      }
    });

    document.addEventListener('submit', event => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      const formName = form.dataset.form;
      if (!formName) return;
      event.preventDefault();
      if (formName === 'login') loginAccount(form);
      if (formName === 'register') registerAccount(form);
      if (formName === 'add-friend') {
        addFriend(form.login.value);
        form.reset();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && ui.modal) closeModal();
    });

    window.addEventListener('storage', event => {
      if ([STORAGE_KEY, SESSION_KEY, SETTINGS_KEY].includes(event.key)) render();
    });

    setInterval(markActive, 45 * 1000);
    saveSettings(loadSettings());
    markActive();
    render();
  </script>
</body>
</html>
