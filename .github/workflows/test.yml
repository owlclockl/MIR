name: Проверки The civilization of the sages

# Этот файл — не сборка и не выкладка: его дело — не пустить в main правку,
# которая ломает проверки. Выкладка живёт отдельно (deploy.yml) и запускается
# после слияния, то есть после этой.
#
# Почему проверки, а не только сборка: сборка отвечает на вопрос «собирается
# ли», а проверки — «работает ли»: границы мира блоками и карты планеты,
# правила хаба, хранение на хостинге, отступы, вес артефактов, поведение
# собранного mir.html в jsdom. Всё это уже написано и стоит секунды;
# пропускать это в CI значит узнавать о поломке от игрока.
#
# Что здесь есть, чего нет на машине разработчика: ничего особенного. `npm
# test` собирает dist/ сам, проверки интерфейса и вида берут jsdom, который
# рядом ставится одной строкой (в обычной сборке его нет намеренно — это
# инструмент проверок, а не зависимость игры). Автономная сборка mir.html не
# пересобирается: для неё нужны зависимости vendored Azgaar (npm run
# fmg:install), а лежащая в репозитории копия проверяется как есть — если
# правка в src/ разошлась с ней, test:build это скажет.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Зависимости
        run: npm ci
      - name: Инструменты проверок (jsdom)
        run: npm i --no-save jsdom
      - name: Проверки
        run: npm test
