<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" width="200" height="52" fill="none">
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2926"/>
      <stop offset="100%" stop-color="#181716"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Emblem Mark -->
  <g filter="url(#glow)">
    <rect x="3" y="3" width="46" height="46" rx="10" fill="url(#emblemGrad)" stroke="#4e4842" stroke-width="1.4"/>
    <!-- Stylized Geometric M -->
    <path d="M15 34V16L26 26.5L37 16V34" stroke="#f4f0eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="12" r="2" fill="#41be4b"/>
  </g>

  <!-- Vector Wordmark MIR -->
  <g transform="translate(60, 10)" stroke="#f4f0eb" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- M -->
    <path d="M4 29V7L17 19.5L30 7V29" stroke-width="2.4"/>
    <!-- I -->
    <path d="M42 7H52 M47 7V29 M42 29H52" stroke-width="2.2"/>
    <!-- R -->
    <path d="M64 29V7H77C82.5 7 86.5 10.5 86.5 15C86.5 19.5 82.5 23 77 23H64 M74 23L86.5 29" stroke-width="2.2"/>
  </g>

  <!-- Game Tag Badge -->
  <rect x="158" y="18" width="38" height="16" rx="3" fill="#41be4b"/>
  <text x="177" y="29.5" fill="#161514" font-family="'Basel Grotesk', -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="0.8" text-anchor="middle">GAME</text>
</svg>