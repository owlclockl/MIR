<!doctype html>
<html lang="ru" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <meta name="description" content="Главное меню игры The civilization of the sages." />
    <title>The civilization of the sages — Главное меню</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap"
    />
    <style>
/* ===========================================================
   The civilization of the sages — главное меню
   Тёмная «штабная» эстетика: острые углы, волосяные линии,
   разрядка в подписях, один акцентный цвет.
   =========================================================== */

:root {
  /* Шрифты */
  --font-ui: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Manrope', var(--font-ui);

  /* Поверхности */
  --bg: #08080a;
  --panel: rgba(13, 13, 15, 0.9);
  --bar: rgba(8, 8, 10, 0.72);
  --fill: rgba(255, 255, 255, 0.035);
  --fill-hover: rgba(255, 255, 255, 0.075);
  --fill-active: rgba(255, 255, 255, 0.11);

  /* Линии */
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.18);

  /* Текст */
  --text: #ededf0;
  --text-soft: #b6b6be;
  --text-dim: #8b8b94;
  --text-faint: #65656e;

  /* Акцент */
  --accent: #c2d9c9;
  --accent-glow: rgba(176, 208, 186, 0.45);

  /* Размеры каркаса */
  --bar-h: 78px;
  --rail-w: 304px;
  --pad-x: clamp(16px, 2vw, 26px);

  /* Типографическая шкала */
  --fs-micro: 10px;
  --fs-small: 11px;
  --fs-base: 12.5px;
  --fs-lead: 15px;

  --ease: cubic-bezier(0.3, 0.8, 0.3, 1);

  font-family: var(--font-ui);
  font-synthesis: none;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body,
#app {
  min-height: 100%;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
  overflow-x: hidden;
}

p,
h1,
h2 {
  margin: 0;
}

button {
  font: inherit;
  color: inherit;
  border-radius: 0;
}

button,
a {
  -webkit-tap-highlight-color: rgba(255, 255, 255, 0.08);
  touch-action: manipulation;
}

:where(button, a):focus-visible {
  outline: 2px solid var(--text);
  outline-offset: 2px;
}

.icon {
  display: block;
  width: 18px;
  height: 18px;
  flex: none;
}

.skip-link {
  position: fixed;
  z-index: 100;
  top: 12px;
  left: 12px;
  padding: 10px 14px;
  color: #0b0b0d;
  background: #fff;
  font-size: var(--fs-small);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  transform: translateY(-200%);
  transition: transform 160ms var(--ease);
}

.skip-link:focus-visible {
  transform: translateY(0);
}

/* ---------- Каркас ------------------------------------------------ */

/* Панель друзей — колонка во всю высоту, шапка — только над сценой.
   Так центр кнопки «Играть» совпадает с центром заголовка. */
.shell {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--rail-w);
  grid-template-rows: var(--bar-h) minmax(0, 1fr) auto;
  grid-template-areas:
    'topbar rail'
    'stage  rail'
    'footer rail';
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
}

/* ---------- Верхняя панель ---------------------------------------- */

.topbar {
  grid-area: topbar;
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  border-bottom: 1px solid var(--line);
  background: var(--bar);
  backdrop-filter: blur(20px) saturate(130%);
  -webkit-backdrop-filter: blur(20px) saturate(130%);
}

.topbar__side {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding-inline: var(--pad-x);
}

.topbar__side--end {
  justify-content: flex-end;
  gap: 12px;
}

.topbar__divider {
  width: 1px;
  height: 26px;
  background: var(--line);
}

.topbar__nav {
  display: flex;
  align-items: stretch;
}

/* Кнопка-иконка */
.icon-button {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  flex: none;
  padding: 0;
  color: var(--text-dim);
  border: 1px solid var(--line);
  background: var(--fill);
  cursor: pointer;
  transition:
    color 160ms var(--ease),
    border-color 160ms var(--ease),
    background-color 160ms var(--ease);
}

.icon-button:hover {
  color: var(--text);
  border-color: var(--line-strong);
  background: var(--fill-hover);
}

.icon-button:active {
  background: var(--fill-active);
}

.icon-button--sm {
  width: 34px;
  height: 34px;
}

.icon-button--sm .icon {
  width: 16px;
  height: 16px;
}

/* Логотип */
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand__mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  color: #0b0b0d;
  background: #e9e9ec;
}

.brand__mark .icon {
  width: 20px;
  height: 20px;
}

.brand__name {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  font-family: var(--font-display);
  font-size: var(--fs-micro);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  white-space: nowrap;
}

.brand__line {
  overflow: hidden;
  color: var(--text-soft);
  text-overflow: ellipsis;
}

.brand__line--muted {
  color: var(--text-faint);
}

/* Кнопка «Играть» */
.play-button {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 100%;
  padding-inline: clamp(26px, 3.2vw, 44px);
  color: var(--text);
  border: 0;
  border-inline: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.042);
  font-family: var(--font-display);
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  white-space: nowrap;
  cursor: pointer;
  overflow: hidden;
  transition: background-color 180ms var(--ease);
}

.play-button:hover {
  background: rgba(255, 255, 255, 0.085);
}

.play-button:active {
  background: var(--fill-active);
}

.play-button::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--text) 22%, var(--text) 78%, transparent);
  opacity: 0.32;
  transform: scaleX(0.3);
  transition:
    transform 260ms var(--ease),
    opacity 260ms var(--ease);
}

.play-button:hover::after,
.play-button:focus-visible::after {
  opacity: 1;
  transform: scaleX(1);
}

.icon--play {
  width: 15px;
  height: 15px;
  fill: currentColor;
}

/* Индикатор присутствия */
.status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  color: var(--text-dim);
  border: 1px solid var(--line);
  font-size: var(--fs-micro);
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
}

.dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 9px var(--accent-glow);
}

.dot--idle {
  background: transparent;
  border: 1.5px solid var(--accent);
  box-shadow: none;
}

.dot--off {
  background: #3b3b41;
  box-shadow: none;
}

/* Профиль */
.profile {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
  max-width: 220px;
  padding: 5px 8px 5px 5px;
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition:
    border-color 160ms var(--ease),
    background-color 160ms var(--ease);
}

.profile:hover {
  border-color: var(--line);
  background: var(--fill-hover);
}

.profile:active {
  background: var(--fill-active);
}

.avatar {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  color: #16161a;
  background: #b9b9be;
  font-size: var(--fs-micro);
  font-weight: 700;
  letter-spacing: 0.08em;
}

.avatar--sm {
  width: 32px;
  height: 32px;
  color: var(--text-dim);
  background: #313136;
}

.profile__text,
.friend__text {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.profile__name,
.friend__name {
  overflow: hidden;
  font-size: var(--fs-base);
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.profile__meta,
.friend__state {
  overflow: hidden;
  color: var(--text-faint);
  font-size: var(--fs-micro);
  line-height: 1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.icon--chevron {
  width: 15px;
  height: 15px;
  color: var(--text-faint);
}

/* ---------- Сцена ------------------------------------------------- */

.stage {
  grid-area: stage;
  position: relative;
  display: grid;
  place-items: center;
  min-height: 0;
  padding: clamp(28px, 6vh, 72px) var(--pad-x);
  overflow: hidden;
  background: radial-gradient(circle at 50% 50%, #242428 0, #151517 30%, #0a0a0b 68%);
}

.atmosphere {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* Сетка */
.atmosphere::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 58px 58px;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000, transparent 68%);
  mask-image: radial-gradient(circle at 50% 50%, #000, transparent 68%);
}

/* Виньетка */
.atmosphere::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(0, 0, 0, 0.55) 100%);
}

.atmosphere__ring {
  position: absolute;
  top: 50%;
  left: 50%;
  aspect-ratio: 1;
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.atmosphere__ring--inner {
  width: min(40vw, 480px);
  box-shadow:
    0 0 110px rgba(255, 255, 255, 0.028),
    inset 0 0 90px rgba(255, 255, 255, 0.022);
}

.atmosphere__ring--outer {
  width: min(64vw, 780px);
  border-color: rgba(255, 255, 255, 0.025);
}

.atmosphere__beam {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 150%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.11) 38%, rgba(255, 255, 255, 0.11) 62%, transparent);
  transform-origin: center;
}

.atmosphere__beam--a {
  transform: translate(-50%, -50%) rotate(-24deg);
}

.atmosphere__beam--b {
  opacity: 0.4;
  transform: translate(-50%, -50%) rotate(62deg);
}

/* Заголовок */
.hero {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 980px;
  text-align: center;
}

.eyebrow {
  color: var(--text-faint);
  font-size: var(--fs-micro);
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  text-indent: 0.3em;
}

.hero__title {
  margin-top: clamp(22px, 3.4vh, 38px);
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 5.6vw + 1rem, 4.6rem);
  font-weight: 500;
  line-height: 0.98;
  letter-spacing: -0.035em;
  text-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
}

.hero__line {
  display: block;
}

.hero__line--tail {
  color: var(--text-soft);
}

.hero__caption {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: clamp(24px, 3.6vh, 40px);
  color: var(--text-dim);
  font-size: var(--fs-small);
  line-height: 1;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.hero__caption::before,
.hero__caption::after {
  content: '';
  width: clamp(26px, 6vw, 64px);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong));
}

.hero__caption::after {
  background: linear-gradient(90deg, var(--line-strong), transparent);
}

.hero__caption span {
  text-indent: 0.2em;
}

/* ---------- Правая панель ----------------------------------------- */

.rail {
  grid-area: rail;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-left: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* Высота шапки панели равна высоте верхней панели —
   линия под ними идёт через весь экран. */
.rail__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  height: var(--bar-h);
  padding-inline: 18px;
  border-bottom: 1px solid var(--line);
}

.rail__heading {
  display: flex;
  flex-direction: column;
  gap: 11px;
  min-width: 0;
}

.rail__title {
  display: flex;
  align-items: baseline;
  gap: 9px;
  font-family: var(--font-display);
  font-size: var(--fs-lead);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.01em;
}

.rail__count {
  color: var(--text-faint);
  font-family: var(--font-ui);
  font-size: var(--fs-small);
  font-weight: 500;
  letter-spacing: 0.08em;
}

.rail__list {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
  padding: 10px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
}

.rail__list::-webkit-scrollbar {
  width: 6px;
}

.rail__list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.14);
}

.friend {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px;
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition:
    border-color 150ms var(--ease),
    background-color 150ms var(--ease);
}

.friend:hover {
  border-color: var(--line);
  background: var(--fill-hover);
}

.friend:active {
  background: var(--fill-active);
}

.friend--live .avatar--sm {
  color: #16161a;
  background: #c3c3c7;
}

.friend--off .avatar--sm,
.friend--off .friend__name {
  color: var(--text-faint);
}

.rail__foot {
  padding: 10px;
  border-top: 1px solid var(--line);
}

.ghost-button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 13px 12px;
  color: var(--text-dim);
  border: 1px solid var(--line);
  background: var(--fill);
  font-size: var(--fs-micro);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition:
    color 150ms var(--ease),
    border-color 150ms var(--ease),
    background-color 150ms var(--ease);
}

.ghost-button span {
  flex: 1;
  text-align: left;
}

.ghost-button:hover {
  color: var(--text);
  border-color: var(--line-strong);
  background: var(--fill-hover);
}

.ghost-button:hover .icon--chevron {
  color: var(--text-dim);
}

.ghost-button:active {
  background: var(--fill-active);
}

/* ---------- Подвал ------------------------------------------------ */

.footer {
  grid-area: footer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px var(--pad-x) max(16px, env(safe-area-inset-bottom));
  color: #55555d;
  font-size: var(--fs-micro);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.footer__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- Адаптив ----------------------------------------------- */

@media (max-width: 1180px) {
  :root {
    --rail-w: 272px;
  }
}

@media (max-width: 1000px) {
  .brand__name {
    letter-spacing: 0.14em;
  }

  /* Остаётся только аватар — стрелка без подписи теряет смысл. */
  .profile__text,
  .profile .icon--chevron {
    display: none;
  }

  .profile {
    padding: 5px;
  }
}

@media (max-width: 860px) {
  :root {
    --bar-h: 68px;
  }

  .shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: var(--bar-h) minmax(0, 1fr) auto auto;
    grid-template-areas:
      'topbar'
      'stage'
      'rail'
      'footer';
  }

  .stage {
    min-height: 46vh;
  }

  .rail {
    border-left: 0;
    border-top: 1px solid var(--line);
  }

  .rail__head {
    height: auto;
    align-items: center;
    padding: 14px 16px;
  }

  .rail__heading {
    flex-direction: row-reverse;
    align-items: baseline;
    justify-content: flex-end;
    gap: 12px;
  }

  .rail__heading .eyebrow {
    display: none;
  }

  .rail__list {
    flex-direction: row;
    gap: 6px;
    padding: 10px;
    overflow-x: auto;
    overflow-y: hidden;
  }

  /* Растягиваются на всю ширину, а при нехватке места — горизонтальная прокрутка. */
  .friend {
    flex: 1 0 168px;
    width: auto;
    border-color: var(--line);
    background: var(--fill);
  }

  .rail__foot {
    display: none;
  }

  .footer {
    justify-content: center;
    padding-block: 12px;
    font-size: 9px;
    letter-spacing: 0.12em;
  }

  .footer span:first-child {
    display: none;
  }
}

@media (max-width: 680px) {
  .brand__name,
  .status,
  .topbar__divider {
    display: none;
  }

  .play-button {
    letter-spacing: 0.16em;
  }
}

/* Низкие экраны — заголовок не должен упираться в панели. */
@media (max-height: 620px) {
  .hero__title {
    font-size: clamp(1.7rem, 4.4vw, 2.9rem);
  }

  .hero__caption::before,
  .hero__caption::after {
    width: 28px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">К главному экрану</a>
    <div id="app"></div>
    <script type="module">
/* Название игры. Разбито на две строки — так оно читается и в шапке, и в заголовке. */
const TITLE = { lead: 'The civilization', tail: 'of the sages' };
const TITLE_FULL = `${TITLE.lead} ${TITLE.tail}`;

/* Иконки Lucide (ISC). Только контуры, 24×24, stroke = currentColor. */
const ICONS = {
  sigil:
    '<circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M12 1.6v2.6M12 19.8v2.6M1.6 12h2.6M19.8 12h2.6"/>',
  settings:

  const { label, modifier } = PRESENCE[presence];
  return `

      <span class="avatar avatar--sm" aria-hidden="true">${initials}</span>

};
