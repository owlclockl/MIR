<!doctype html>
<html lang="ru" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="Главное меню MIR" />
    <title>MIR — Главное меню</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap');

:root {
  font-family: Inter, system-ui, sans-serif;
  color: #f4f4f5;
  background: #09090a;
  font-synthesis: none;
  --panel: rgba(16, 16, 18, 0.88);
  --line: rgba(255, 255, 255, 0.09);
  --muted: #85858d;
  --bright: #f6f6f7;
}

* { box-sizing: border-box; }
html, body, #app { min-height: 100%; }
body { margin: 0; min-width: 320px; min-height: 100vh; overflow-x: hidden; background: #09090a; }
button, a { -webkit-tap-highlight-color: rgba(255,255,255,.1); touch-action: manipulation; }
button { font: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.skip-link { position: fixed; z-index: 100; top: 12px; left: 12px; padding: 10px 14px; color: #111; background: #fff; transform: translateY(-150%); transition: transform 160ms ease; }
.skip-link:focus { transform: translateY(0); }

.shell { position: relative; min-height: 100vh; overflow: hidden; background: radial-gradient(circle at 47% 48%, #252528 0, #151517 29%, #0a0a0b 68%); }
.topbar { position: relative; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 76px; padding: max(12px, env(safe-area-inset-top)) 22px 12px; border-bottom: 1px solid var(--line); background: rgba(9,9,10,.78); backdrop-filter: blur(18px); }
.topbar__left, .topbar__right { display: flex; align-items: center; gap: 14px; min-width: 0; }
.topbar__right { justify-content: flex-end; }
.icon-button { display: grid; width: 42px; height: 42px; place-items: center; padding: 0; color: #a0a0a7; border: 1px solid var(--line); background: rgba(255,255,255,.025); cursor: pointer; transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease; }
.icon-button:hover { color: #fff; border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.07); }
.icon-button svg { width: 19px; }
.icon-button--small { width: 36px; height: 36px; }
.brand { display: flex; align-items: center; gap: 9px; color: #d5d5d8; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .23em; text-decoration: none; }
.brand:hover { color: #fff; }
.brand__mark { display: grid; width: 28px; height: 28px; place-items: center; color: #0a0a0b; background: #e7e7e9; font-size: 12px; letter-spacing: 0; }
.primary-nav { align-self: stretch; display: flex; align-items: center; }
.play-button { position: relative; display: flex; height: 76px; align-items: center; gap: 11px; padding: 0 36px; color: #f5f5f6; border: 0; border-inline: 1px solid var(--line); background: rgba(255,255,255,.045); text-transform: uppercase; letter-spacing: .16em; font-size: 12px; font-weight: 700; cursor: pointer; transition: background-color 160ms ease, color 160ms ease; }
.play-button::after { position: absolute; right: 28px; bottom: -1px; left: 28px; height: 2px; background: #fff; content: ''; transform: scaleX(.38); transition: transform 180ms ease; }
.play-button:hover { background: rgba(255,255,255,.1); }
.play-button:hover::after { transform: scaleX(1); }
.play-button__icon { width: 17px; }
.status-pill { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .09em; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #b8d3c1; box-shadow: 0 0 10px #91b69d; }
.profile { display: flex; min-width: 156px; align-items: center; gap: 10px; padding: 4px 6px; color: #ddd; border: 0; background: transparent; text-align: left; cursor: pointer; transition: background-color 160ms ease; }
.profile:hover { background: rgba(255,255,255,.05); }
.profile__avatar, .friend__avatar { display: grid; flex: 0 0 auto; place-items: center; color: #161618; background: #b8b8bc; font-size: 10px; font-weight: 700; letter-spacing: .06em; }
.profile__avatar { width: 34px; height: 34px; }
.profile__copy, .friend__info { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 3px; }
.profile__copy strong, .friend__info strong { overflow: hidden; font-size: 11px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.profile__copy small, .friend__info small { color: #74747b; font-size: 9px; }
.profile__chevron { width: 14px; color: #696970; }
.main-stage { position: relative; min-height: calc(100vh - 76px); margin-right: 286px; }
.atmosphere { position: absolute; inset: 0; overflow: hidden; }
.atmosphere::before { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px); background-size: 58px 58px; content: ''; mask-image: radial-gradient(circle at center, #000, transparent 67%); }
.atmosphere__glow { position: absolute; top: 50%; left: 50%; width: min(48vw, 620px); aspect-ratio: 1; border: 1px solid rgba(255,255,255,.04); border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 110px rgba(255,255,255,.03), inset 0 0 90px rgba(255,255,255,.025); }
.atmosphere__line { position: absolute; top: 50%; left: 50%; width: 62vw; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent); transform-origin: center; }
.atmosphere__line--one { transform: translate(-50%,-50%) rotate(-26deg); }
.atmosphere__line--two { transform: translate(-50%,-50%) rotate(63deg); opacity: .45; }
.hero { position: absolute; z-index: 1; top: 50%; left: 50%; text-align: center; transform: translate(-50%,-56%); }
.eyebrow, .friends__eyebrow { margin: 0 0 11px; color: #6d6d74; font-size: 9px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; }
.hero h1 { margin: 0; font-family: Manrope, sans-serif; font-size: clamp(82px, 12vw, 174px); font-weight: 500; line-height: .8; letter-spacing: -.09em; text-wrap: balance; text-shadow: 0 8px 45px rgba(0,0,0,.75); }
.hero__caption { margin: 29px 0 0; color: #77777d; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.friends { position: absolute; z-index: 5; top: 76px; right: 0; bottom: 0; display: flex; width: 286px; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(18px); }
.friends__header { display: flex; align-items: center; justify-content: space-between; padding: 25px 21px 20px; border-bottom: 1px solid var(--line); }
.friends__header h2 { margin: 0; font-family: Manrope, sans-serif; font-size: 14px; letter-spacing: .02em; }
.friends__header h2 span { margin-left: 5px; color: #626269; font-size: 10px; font-weight: 500; }
.friends__list { flex: 1; padding: 12px 9px; }
.friend { display: flex; width: 100%; align-items: center; gap: 11px; padding: 10px 11px; color: #ddd; border: 0; background: transparent; text-align: left; cursor: pointer; transition: background-color 150ms ease; }
.friend:hover { background: rgba(255,255,255,.055); }
.friend__avatar { width: 34px; height: 34px; background: #3b3b3f; color: #a6a6ac; }
.friend:nth-child(2) .friend__avatar { background: #c1c1c4; color: #171719; }
.friend__status { width: 6px; height: 6px; border-radius: 50%; background: #acccb7; box-shadow: 0 0 8px rgba(172,204,183,.45); }
.friend__status--offline { background: #434348; box-shadow: none; }
.friends__all { display: flex; align-items: center; gap: 10px; margin: 10px; padding: 13px 12px; color: #8c8c93; border: 1px solid var(--line); background: rgba(255,255,255,.02); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: color 150ms ease, background-color 150ms ease; }
.friends__all:hover { color: #fff; background: rgba(255,255,255,.055); }
.friends__all span { flex: 1; text-align: left; }
.friends__all svg { width: 15px; }
.footer { position: absolute; z-index: 4; right: 306px; bottom: 18px; left: 20px; display: flex; justify-content: space-between; color: #48484e; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; }
.toast { position: fixed; z-index: 50; bottom: 28px; left: 50%; padding: 11px 16px; color: #d8d8db; border: 1px solid var(--line); background: #1a1a1d; font-size: 11px; opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: opacity 160ms ease, transform 160ms ease; }
.toast--visible { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .topbar { grid-template-columns: 1fr auto 1fr; padding-inline: 12px; }
  .brand > span:last-child, .status-pill, .profile__copy, .profile__chevron { display: none; }
  .profile { min-width: 0; padding: 0; }
  .play-button { padding-inline: 22px; }
  .main-stage { min-height: calc(100vh - 76px - 178px); margin-right: 0; }
  .friends { top: auto; left: 0; width: 100%; height: 178px; border-top: 1px solid var(--line); border-left: 0; }
  .friends__header { padding: 13px 16px 10px; }
  .friends__list { display: flex; padding: 7px 9px; overflow-x: auto; }
  .friend { min-width: 150px; padding-block: 7px; }
  .friends__all { display: none; }
  .footer { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">К главному экрану</a>
    <div id="app"></div>
    <script type="module">
const icon = (name, className = '') => {
  const paths = {
    settings: '<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.94 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.57 15 1.7 1.7 0 0 0 3 14H3v-4h.08A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.57 1.7 1.7 0 0 0 10 3V3h4v.08a1.7 1.7 0 0 0 1.06 1.52 1.7 1.7 0 0 0 1.88-.34L17 4.2 19.83 7l-.06.06A1.7 1.7 0 0 0 19.43 9 1.7 1.7 0 0 0 21 10h.08v4H21a1.7 1.7 0 0 0-1.6 1Z"/>',
    play: '<path d="m8 5 11 7-11 7V5Z"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    userPlus: '<path d="M15 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
    chevron: '<path d="m9 18 6-6-6-6"/>',
    close: '<path d="m18 6-12 12M6 6l12 12"/>'
  };
  return `<svg class="${className}" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`;
};

const friends = [
  { initials: 'AK', name: 'AKIRA', status: 'В игре', online: true },
  { initials: 'NV', name: 'NOVA', status: 'В меню', online: true },
  { initials: 'GR', name: 'GREY', status: 'Не в сети', online: false },
];

document.querySelector('#app').innerHTML = `
  <div class="shell">
    <header class="topbar">
      <div class="topbar__left">
        <button class="icon-button" type="button" aria-label="Открыть настройки" data-action="settings">
          ${icon('settings')}
        </button>
        <a class="brand" href="/" aria-label="MIR — главное меню" translate="no">
          <span class="brand__mark">M</span><span>MIR</span>
        </a>
      </div>

      <nav class="primary-nav" aria-label="Основная навигация">
        <button class="play-button" type="button" data-action="play">
          ${icon('play', 'play-button__icon')}
          <span>Играть</span>
        </button>
      </nav>

      <div class="topbar__right">
        <span class="status-pill"><span class="status-dot"></span> В сети</span>
        <button class="profile" type="button" aria-label="Открыть профиль">
          <span class="profile__avatar">MI</span>
          <span class="profile__copy"><strong>Игрок</strong><small>Уровень 12</small></span>
          ${icon('chevron', 'profile__chevron')}
        </button>
      </div>
    </header>

    <main id="main" class="main-stage">
      <div class="atmosphere" aria-hidden="true">
        <span class="atmosphere__line atmosphere__line--one"></span>
        <span class="atmosphere__line atmosphere__line--two"></span>
        <span class="atmosphere__glow"></span>
      </div>
      <section class="hero" aria-labelledby="menu-title">
        <p class="eyebrow">Тактический протокол</p>
        <h1 id="menu-title">MIR</h1>
        <p class="hero__caption">Тишина — тоже оружие.</p>
      </section>
    </main>

    <aside class="friends" aria-labelledby="friends-title">
      <div class="friends__header">
        <div>
          <p class="friends__eyebrow">Сообщество</p>
          <h2 id="friends-title">Друзья <span>2 / 3</span></h2>
        </div>
        <button class="icon-button icon-button--small" type="button" aria-label="Добавить друга">
          ${icon('userPlus')}
        </button>
      </div>
      <div class="friends__list">
        ${friends.map(friend => `
          <button class="friend" type="button" aria-label="Открыть профиль ${friend.name}">
            <span class="friend__avatar">${friend.initials}</span>
            <span class="friend__info"><strong>${friend.name}</strong><small>${friend.status}</small></span>
            <span class="friend__status ${friend.online ? '' : 'friend__status--offline'}" aria-label="${friend.online ? 'В сети' : 'Не в сети'}"></span>
          </button>
        `).join('')}
      </div>
      <button class="friends__all" type="button">
        ${icon('users')}
        <span>Все друзья</span>
        ${icon('chevron')}
      </button>
    </aside>

    <div class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <footer class="footer"><span>Версия 0.1.0</span><span>© 2026 MIR</span></footer>
  </div>
`;

const toast = document.querySelector('.toast');
let toastTimer;
function notify(message) {
  toast.textContent = message;
  toast.classList.add('toast--visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('toast--visible'), 2200);
}

document.querySelector('[data-action="play"]').addEventListener('click', () => notify('Поиск матча скоро будет доступен'));
document.querySelector('[data-action="settings"]').addEventListener('click', () => notify('Настройки скоро будут доступны'));

    </script>
  </body>
</html>
