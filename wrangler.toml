# Настройки бесплатного хостинга Cloudflare Workers.
#
#   npm run host        собрать игру и выложить её в интернет
#   npm run host:dev    то же самое локально, без выкладывания
#
# Что получится: адрес https://mir.ВАШ-АККАУНТ.workers.dev, на
# котором лежит и сама игра (dist/), и хаб общих аккаунтов (/api/*).
# Бесплатного тарифа хватает с запасом: 100 000 запросов в сутки,
# аккаунты и друзья хранятся в Durable Object со SQLite.
#
# Имя ниже можно поменять — оно станет первой частью адреса.

name = "mir"
main = "hosting/cloudflare/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Сама игра: статические файлы из dist/. Запросы к /api/* идут мимо
# них, в код воркера, — иначе хаб перехватывала бы страница игры.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Ключ скрытой панели админа (знак игры — 7 быстрых касаний за 2,8 секунды,
# Ctrl+Shift+Alt+A или адрес с #admin). По умолчанию действует заводской
# ключ owlananaslwo — он публичный, панель напоминает его сменить.
# Свой ключ задаётся секретом, один раз, командой
#
#   npm run host:secret
#   (то же самое: npx wrangler secret put MIR_ADMIN_KEY)
#
# и переживает все последующие выкладывания, в том числе автодеплой из
# GitHub Actions. Ключ также меняется в самой панели — он хранится в
# данных хаба. Реальный ключ сюда вписывать нельзя — [vars] видны в
# исходнике репозитория, секрет — только через wrangler secret put.
# [vars]
# MIR_ADMIN_KEY = "свой-ключ"
# Список текущих секретов: npm run host:secrets (npx wrangler secret list)

# Хаб: общие аккаунты, друзья, заявки, сигналинг P2P.
[[durable_objects.bindings]]
name = "HUB"
class_name = "MirHub"

# SQLite-хранилище — единственный вид Durable Object на бесплатном тарифе.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MirHub"]
