<rect width="1440" height="900" fill="#080d0e"/>

<!-- сцена -->
<rect y="78" width="1136" height="780" fill="url(#stageBg)"/>
<rect y="78" width="1136" height="780" fill="url(#grid)" mask="url(#gridFade)"/>
<g clip-path="url(#stageClip)">
