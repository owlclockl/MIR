<g>
  <rect x="292" y="682" width="196" height="66" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".08"/>
  <text x="312" y="716" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="600" fill="#ededf0">1<tspan font-size="13" fill="#8b8b94">/2</tspan></text>
  <text x="312" y="735" font-size="10" fill="#65656e">друзей в сети</text>
