<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, Arial, sans-serif">
<title>The civilization of the sages — главное меню</title>
<defs>
  <radialGradient id="stageBg" cx="50%" cy="50%" r="68%">
    <stop offset="0" stop-color="#242428"/><stop offset=".44" stop-color="#151517"/><stop offset="1" stop-color="#0a0a0b"/>
  </radialGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="62%">
    <stop offset=".42" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
  <radialGradient id="gridMask" cx="50%" cy="50%" r="68%">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <linearGradient id="beam"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".38" stop-color="#fff" stop-opacity=".11"/><stop offset=".62" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="accentL"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
  <linearGradient id="accentR"><stop stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="playAccent"><stop stop-color="#ededf0" stop-opacity="0"/><stop offset=".22" stop-color="#ededf0"/><stop offset=".78" stop-color="#ededf0"/><stop offset="1" stop-color="#ededf0" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" fill="none" stroke="#fff" stroke-opacity=".02"/></pattern>
  <mask id="gridFade"><rect y="78" width="1136" height="780" fill="url(#gridMask)"/></mask>
  <clipPath id="stageClip"><rect y="78" width="1136" height="780"/></clipPath>
