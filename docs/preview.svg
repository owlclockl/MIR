  <circle cx="568" cy="468" r="390" fill="none" stroke="#fff" stroke-opacity=".025"/>
  <rect x="-284" y="467.5" width="1704" height="1" fill="url(#beam)" transform="rotate(-24 568 468)"/>
  <rect x="-284" y="467.5" width="1704" height="1" fill="url(#beam)" opacity=".4" transform="rotate(62 568 468)"/>
</g>
<rect y="78" width="1136" height="780" fill="url(#vignette)"/>

<!-- заголовок -->
<g text-anchor="start">
  <text x="292" y="359" font-size="10" font-weight="600" letter-spacing="3" fill="#91a39b">ЦИВИЛИЗАЦИЯ МУДРЕЦОВ · КАРТОГРАФИЧЕСКИЙ ШТАБ</text>
  <g font-family="Manrope, Arial, sans-serif" font-size="73.6" font-weight="500" letter-spacing="-2.58">
    <text x="292" y="455" fill="#ededf0">The civilization</text>
    <text x="292" y="527" fill="#b6b6be">of the sages</text>
  </g>
  <text x="292" y="581" font-size="11" letter-spacing="2.2" fill="#91a39b">МУДРОСТЬ СОЗДАЁТ МИРЫ.</text>
</g>

