<rect x="859" y="24.5" width="86" height="28" fill="none" stroke="#fff" stroke-opacity=".08"/>
<circle cx="874.5" cy="38.5" r="3.5" fill="#c2d9c9"/>
<text x="886" y="42" font-size="10" font-weight="500" letter-spacing="1.4" fill="#8b8b94">В СЕТИ</text>
