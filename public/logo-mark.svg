<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="title desc">
  <title id="title">The civilization of the sages — знак</title>
  <desc id="desc">Фирменная печать: кольцо, центральная точка и четыре риски по сторонам света. Картографический ориентир и знак знания.</desc>
  <!-- Геометрия знака та же, что у icon('sigil') в интерфейсе и у PNG-иконок
       приложения: кольцо r=8.2, точка r=2.4, риски 1.6–4.2 от края.
       Цвета — бренд-система: шалфей #c2d9c9 — знак, старинное золото
       #d8c184 — центральная точка (картографический акцент). -->
  <g fill="none" stroke="#c2d9c9" stroke-width="1.7" stroke-linecap="round">
    <circle cx="12" cy="12" r="8.2"/>
    <path d="M12 1.6v2.6M12 19.8v2.6M1.6 12h2.6M19.8 12h2.6"/>
  </g>
  <circle cx="12" cy="12" r="2.4" fill="#d8c184"/>
</svg>
