<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">The civilization of the sages</title>
  <desc id="desc">Логотип: фирменная печать — кольцо, золотая точка и стороны света, — полное название игры и фраза «Мудрость создаёт миры.»</desc>
  <!-- Знак: та же геометрия, что у icon('sigil') в интерфейсе, PNG-иконок
       приложения и public/logo-mark.svg (кольцо r=8.2, точка r=2.4, риски
       по сторонам света), увеличенная в 5.33 раза: 24 единицы = 128px.
       Цвета и шрифты — бренд-система (docs/brand-guidelines.md):
       шалфей #c2d9c9 — знак и второй план названия, старинное золото
       #d8c184 — точка и разделитель, светлый камень #eef2ef — название,
       тихий камень #9ca8a0 — фирменная фраза. Фон прозрачный: логотип
       рассчитан на тёмные поверхности игры (#080d0e и глубже). -->
  <g transform="translate(26 26) scale(5.3333)">
    <g fill="none" stroke="#c2d9c9" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.2"/>
      <path d="M12 1.6v2.6M12 19.8v2.6M1.6 12h2.6M19.8 12h2.6"/>
    </g>
    <circle cx="12" cy="12" r="2.4" fill="#d8c184"/>
  </g>
  <g font-family="Manrope, Inter, 'Segoe UI', Arial, sans-serif">
    <text x="196" y="82" font-size="43" font-weight="700" letter-spacing="5" fill="#eef2ef">THE CIVILIZATION</text>
    <text x="196" y="128" font-size="43" font-weight="700" letter-spacing="5" fill="#c2d9c9">OF THE SAGES</text>
  </g>
  <rect x="199" y="146" width="34" height="2" fill="#d8c184"/>
  <text x="246" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#9ca8a0">МУДРОСТЬ СОЗДАЁТ МИРЫ</text>
</svg>
